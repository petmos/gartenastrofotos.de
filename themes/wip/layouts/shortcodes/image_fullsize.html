<!-- layouts/shortcodes/image_fullsize.html -->
{{- $imageSrc := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- $image := resources.Get $imageSrc -}}

{{- $thumb := $image.Resize "800x" -}}  <!-- Thumbnail generieren: 800px Breite -->

<img src="{{ $thumb.Permalink }}"
     class="zoomable"
     alt="{{ $alt }}"
     style="cursor:pointer;"
     title="Klick to enlarge">
<a href="{{ $image.Permalink }}">Full resolution</a>
